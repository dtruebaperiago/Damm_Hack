services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: damm_demo
      POSTGRES_USER: damm_demo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD al fitxer .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - damm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U damm_demo -d damm_demo"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  damm_postgres_data:
